<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Powered Music Creation Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-gradient-to-b from-black via-zinc-900 to-black text-white font-sans">

    <div class="relative max-w-7xl mx-auto px-6 py-24 text-center">
        <h1 class="text-5xl md:text-7xl font-black leading-tight">
            Create Viral <span class="text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-orange-400 to-pink-500">In Seconds</span>
        </h1>
        <p class="text-zinc-300 text-lg mt-6 max-w-xl mx-auto">
            Generate cinematic bhakti songs, romantic music, reels audio, and AI vocals instantly.
        </p>
    </div>

    <div class="max-w-2xl mx-auto bg-zinc-900/80 backdrop-blur-xl border border-zinc-800 rounded-[25px] p-8 shadow-2xl mb-24">
        <h2 class="text-3xl font-bold mb-6">🎵 AI Song Generator</h2>
        
        <div class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-zinc-400 mb-2">Describe your song:</label>
                <textarea id="songPrompt" class="w-full h-36 rounded-2xl bg-black/40 border border-zinc-700 p-5 outline-none focus:border-yellow-500 text-white" placeholder="Example: Create a powerful Lord Shiva bhakti song with emotional flute..."></textarea>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <select id="genre" class="bg-black/40 border border-zinc-700 rounded-2xl p-4 outline-none text-white">
                    <option value="Bhakti">Bhakti</option>
                    <option value="Romantic">Romantic</option>
                    <option value="Sad">Sad</option>
                    <option value="LoFi">LoFi</option>
                </select>

                <select id="voice" class="bg-black/40 border border-zinc-700 rounded-2xl p-4 outline-none text-white">
                    <option value="Female">Female Voice</option>
                    <option value="Male">Male Voice</option>
                </select>
            </div>

            <button id="generateBtn" onclick="generateSong()" class="w-full px-8 py-4 rounded-2xl bg-gradient-to-r from-yellow-400 to-orange-500 text-black font-bold text-lg hover:opacity-90 transition cursor-pointer">
                Generate Song
            </button>

            <div id="statusResult" class="mt-6 text-center hidden">
                <p id="statusText" class="text-yellow-400 font-semibold"></p>
                <audio id="audioPlayer" controls class="w-full mt-4 hidden"></audio>
            </div>
        </div>
    </div>

    <script>
        async function generateSong() {
            const prompt = document.getElementById('songPrompt').value;
            const genre = document.getElementById('genre').value;
            const voice = document.getElementById('voice').value;
            const button = document.getElementById('generateBtn');
            const statusResult = document.getElementById('statusResult');
            const statusText = document.getElementById('statusText');
            const audioPlayer = document.getElementById('audioPlayer');

            if (!prompt.trim()) {
                alert("Please enter a description for your song!");
                return;
            }

            // Button ko disable karna taaki user baar-baar click na kare
            button.disabled = true;
            button.innerText = "Generating Music... Please wait";
            statusResult.classList.remove('hidden');
            audioPlayer.classList.add('hidden');
            statusText.innerText = "⚡ AI is composing your " + genre + " song (" + voice + ")...";

            try {
                // NOTE: Yahan asli Suno/Udio ki Paid API ka URL aata hai. 
                // Abhi test karne ke liye hum ek dummy background music link use kar rahe hain.
                
                setTimeout(() => {
                    // Gaana banne ka acting simulator (3 second baad gaana chalega)
                    statusText.innerText = "✅ Your song is ready! Click play below:";
                    
                    // Ek sample free music track loading (Testing ke liye)
                    audioPlayer.src = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"; 
                    audioPlayer.classList.remove('hidden');
                    
                    button.disabled = false;
                    button.innerText = "Generate Another Song";
                }, 4000); // 4 seconds delay

            } catch (error) {
                statusText.innerText = "❌ Error generating song. Try again.";
                button.disabled = false;
                button.innerText = "Generate Song";
            }
        }
    </script>
</body>
</html>
